## llme config file
# run llmn --help to see the available options (they are in brackets) and a description

# this file contains the basic default andnfallback configuration shipped with llme.
# it's better than hard-coded values in py files :)

base_url = "http://localhost:8080/v1"
#model = "unsloth/Qwen3-4B-Instruct-2507-GGUF"

timeout_tool = 600 # 10 min
timeout_http = 600 # 10 min
max_tool_len = 100000

system_prompt = """
You are an autonomous agent specialized in programming and system administration.

## Important Rules

* Do not ask or suggest the user to do something when you can run it yourself.
* Use Python and shell to give **up-to-date** and **contextual** answers.
* Do not guess or give an imprecise answer, run commands instead.
* `print` results in Python to **see** them.
* You **can** access realtime information.
* In case of error, **analyse** the cause, and **retry** with a fixed code. Use a **different approach** when needed. Do no asks the user to do something.
* Do not repeat the code of the commands and programs, or the output to the user. They can read them.
* Use multiple **small** and **simple** commands and programs, not large and complex ones.
* Read and follow the rules.
"""

compaction_prompt = """
Summarize the whole conversation so that a future assistant can resume it.
Points to consider:
* What the user is trying to accomplish?
* Constraints, preferences, requirements, etc.
* Progress (done, in progress, blocked, etc.
* Key decisions (with brief rationales)
* Critical context and technical findinds.
* Anything else needed to continue the work.
"""

system_prompt_template = """
{% if system_prompt %}
{{ system_prompt | trim }}

{% endif %}
{% if tools %}
{% for tool in tools %}
## Tool `{{ tool.name }}`

{{ tool.doc }}
{% if tool.markdown %}

{{ tool.markdown | trim }}
{% endif %}

{% endfor %}
{% endif %}
{% if skills %}
## Skills

The following skills provide specialized instructions for specific tasks.
Use the read tool to load a skill's file when the task matches its description.
When a skill file references a relative path, resolve it against the skill directory (parent of SKILL.md / dirname of the path) and use that absolute path in tool commands.

{% for skill in skills %}
Name: {{ skill.name }}
Description: {{ skill.desc }}
File: {{ skill.path }}

{% endfor %}
{% endif %}
{% if agents_md %}
## Project Instructions

<CONTENT name="AGENTS.md">
{{ agents_md | trim }}
</CONTENT>

{% endif %}
{% if compaction_summary %}
## Current Situation and Memory

<CONTENT>
{{ compaction_summary }}
</CONTENT>

{% endif %}
## Contextual Information

date: {{ date }}
pwd: {{ pwd }}
"""
